<template>
    <lightning-card title="Encargos" icon-name="standard:orders">
        <div class="slds-p-around_small">
            <lightning-button variant="neutral" label="Refrescar" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button>
        </div>

        <template if:true={loading}>
            <div class="slds-is-relative slds-p-around_medium">
                <lightning-spinner size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-horizontal_medium slds-text-color_error">{error}</div>
        </template>

        <template if:true={rows}>
            <lightning-datatable
                key-field="id"
                data={rows}
                columns={columns}
                sorted-by={sortBy}
                sorted-direction={sortDirection}
                onsort={handleSort}
                hide-checkbox-column
            >
            </lightning-datatable>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error">{error}</div>
        </template>

        
    </lightning-card>
</template>
